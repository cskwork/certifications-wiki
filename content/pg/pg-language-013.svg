<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 0.0 1280.0 741.0" width="1280" height="741" style="max-width: 100%; height: auto; background: #ffffff;">
  <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
  <rect x="40.0" y="40.0" width="1200.0" height="56.0" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="22" text-anchor="start" fill="#1e1e1e" x="56.0" y="72.0"><tspan x="56.0" dy="0">Java 재귀함수</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#555" x="56.0" y="88.0"><tspan x="56.0" dy="0">static 메서드 재귀 · 호출 트리 · 출력 순서 (전/후)</tspan></text>
  <rect x="1080.0" y="48.0" width="104.0" height="28.0" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" x="1135.7" y="67.0"><tspan x="1135.7" dy="0">🔥 매회 출제</tspan></text>
  <rect x="60.0" y="130.0" width="560.0" height="280.0" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="18" text-anchor="start" fill="#1e1e1e" x="74.0" y="158.0"><tspan x="74.0" dy="0">숫자 뒤집기  f(1234) → 4321</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e" x="74.0" y="185.0"><tspan x="74.0" dy="0">static void f(int n) {</tspan><tspan x="74.0" dy="16">    if (n &lt;= 0) return;</tspan><tspan x="74.0" dy="16">    System.out.print(n % 10);</tspan><tspan x="74.0" dy="16">    f(n / 10);</tspan><tspan x="74.0" dy="16">}</tspan><tspan x="74.0" dy="16">f(1234);</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e" x="74.0" y="313.0"><tspan x="74.0" dy="0">f(1234) → print 4, f(123)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e" x="74.0" y="335.0"><tspan x="74.0" dy="0">f(123)  → print 3, f(12)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e" x="74.0" y="357.0"><tspan x="74.0" dy="0">f(12)   → print 2, f(1)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e" x="74.0" y="379.0"><tspan x="74.0" dy="0">f(1)    → print 1, f(0)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e" x="74.0" y="401.0"><tspan x="74.0" dy="0">f(0)    → return</tspan></text>
  <rect x="660.0" y="130.0" width="580.0" height="280.0" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="18" text-anchor="start" fill="#1e1e1e" x="674.0" y="158.0"><tspan x="674.0" dy="0">호출 트리  factorial(4) = 24</tspan></text>
  <rect x="674.0" y="178.0" width="460.0" height="48.0" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#c92a2a" x="684.0" y="196.0"><tspan x="684.0" dy="0">fact(4)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1e1e1e" x="684.0" y="214.0"><tspan x="684.0" dy="0">= 4 * fact(3)</tspan></text>
  <rect x="704.0" y="234.0" width="460.0" height="48.0" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#c92a2a" x="714.0" y="252.0"><tspan x="714.0" dy="0">fact(3)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1e1e1e" x="714.0" y="270.0"><tspan x="714.0" dy="0">= 3 * fact(2)</tspan></text>
  <rect x="734.0" y="290.0" width="460.0" height="48.0" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#c92a2a" x="744.0" y="308.0"><tspan x="744.0" dy="0">fact(2)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1e1e1e" x="744.0" y="326.0"><tspan x="744.0" dy="0">= 2 * fact(1)</tspan></text>
  <rect x="764.0" y="346.0" width="460.0" height="48.0" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#c92a2a" x="774.0" y="364.0"><tspan x="774.0" dy="0">fact(1)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1e1e1e" x="774.0" y="382.0"><tspan x="774.0" dy="0">= 1  (Base)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#c92a2a" x="674.0" y="418.0"><tspan x="674.0" dy="0">복귀: 1 → 2 → 6 → 24</tspan></text>
  <rect x="60.0" y="430.0" width="580.0" height="240.0" rx="10" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="18" text-anchor="start" fill="#1e1e1e" x="74.0" y="458.0"><tspan x="74.0" dy="0">출력 위치가 순서를 결정</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1e1e1e" x="74.0" y="484.0"><tspan x="74.0" dy="0">// 재귀 호출 &#x27;전&#x27; 출력 → 순방향</tspan><tspan x="74.0" dy="15">void forward(int n) {</tspan><tspan x="74.0" dy="15">    if (n &lt;= 0) return;</tspan><tspan x="74.0" dy="15">    print(n + &quot; &quot;);</tspan><tspan x="74.0" dy="15">    forward(n - 1);</tspan><tspan x="74.0" dy="15">}</tspan><tspan x="74.0" dy="15">forward(3) → &quot;3 2 1&quot;</tspan><tspan x="74.0" dy="15"></tspan><tspan x="74.0" dy="15">// 재귀 호출 &#x27;후&#x27; 출력 → 역방향</tspan><tspan x="74.0" dy="15">void backward(int n) {</tspan><tspan x="74.0" dy="15">    if (n &lt;= 0) return;</tspan><tspan x="74.0" dy="15">    backward(n - 1);</tspan><tspan x="74.0" dy="15">    print(n + &quot; &quot;);</tspan><tspan x="74.0" dy="15">}</tspan><tspan x="74.0" dy="15">backward(3) → &quot;1 2 3&quot;</tspan></text>
  <rect x="660.0" y="430.0" width="580.0" height="240.0" rx="10" fill="#ffdeeb" stroke="#1e1e1e" stroke-width="2"/>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" text-anchor="start" fill="#1e1e1e" x="674.0" y="456.0"><tspan x="674.0" dy="0">고난도: 재귀 + 오버라이딩 (2024-2회)</tspan></text>
  <text font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1e1e1e" x="674.0" y="484.0"><tspan x="674.0" dy="0">class A {</tspan><tspan x="674.0" dy="15">    int f(int n) {</tspan><tspan x="674.0" dy="15">        if (n&lt;=1) return 1;</tspan><tspan x="674.0" dy="15">        return n * f(n-1); // 곱</tspan><tspan x="674.0" dy="15">    }</tspan><tspan x="674.0" dy="15">}</tspan><tspan x="674.0" dy="15">class B extends A {</tspan><tspan x="674.0" dy="15">    @Override</tspan><tspan x="674.0" dy="15">    int f(int n) {</tspan><tspan x="674.0" dy="15">        if (n&lt;=1) return 1;</tspan><tspan x="674.0" dy="15">        return n + f(n-1); // 합 (재정의)</tspan><tspan x="674.0" dy="15">    }</tspan><tspan x="674.0" dy="15">}</tspan><tspan x="674.0" dy="15">A o = new B();</tspan><tspan x="674.0" dy="15">o.f(4); // 동적 바인딩 → 4+3+2+1 = 10</tspan></text>
</svg>
